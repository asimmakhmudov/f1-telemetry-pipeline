schema: target
sql: "-- Laps of the most recent race only, so lap times are comparable on one circuit.\n\
  SELECT l.*, d.\"NameAcronym\", d.\"TeamName\", s.\"MeetingName\", s.\"CircuitShortName\"\
  , s.\"SessionName\", s.\"SessionDate\"\nFROM target.lap_telemetry AS l\nJOIN target.driver_session_summary\
  \ AS d USING (\"SessionKey\", \"DriverNumber\")\nJOIN target.session_conditions\
  \ AS s USING (\"SessionKey\")\nWHERE l.\"SessionKey\" = (\n    SELECT max(\"SessionKey\"\
  ) FROM target.session_conditions WHERE \"SessionName\" = 'Race'\n)"
