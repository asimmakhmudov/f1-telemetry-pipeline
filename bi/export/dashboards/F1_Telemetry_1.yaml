css: "@import url('https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap');\n\
  \n:root { --f1-red: #E10600; --f1-carbon: #15151E; --f1-carbon-2: #1F1F2B; --f1-line:\
  \ #38383F; }\n\nbody, .dashboard, .dashboard * { font-family: 'Titillium Web', 'Inter',\
  \ Helvetica, Arial, sans-serif !important; }\n\n/* Page */\nbody, #app, .dashboard,\
  \ .dashboard-content, .grid-container, .dashboard-content > div {\n  background-color:\
  \ var(--f1-carbon) !important;\n}\n.grid-container { padding-top: 8px; }\n\n/* Title\
  \ bar */\n[data-test=\"dashboard-header-container\"], .header-with-actions {\n \
  \ background: var(--f1-carbon) !important;\n  border-bottom: 3px solid var(--f1-red)\
  \ !important;\n}\n[data-test=\"editable-title\"], [data-test=\"editable-title\"\
  ] input, .header-with-actions .title-panel {\n  color: #FFFFFF !important; font-weight:\
  \ 900 !important; letter-spacing: .04em; text-transform: uppercase;\n}\n.header-with-actions\
  \ .anticon, .header-with-actions .metadata-bar, .header-with-actions .metadata-bar\
  \ * {\n  color: #A9A9B3 !important;\n}\n\n/* Chart cards */\n.dashboard-component-chart-holder\
  \ {\n  background: #FFFFFF !important;\n  border-radius: 4px !important;\n  border-top:\
  \ 3px solid var(--f1-red) !important;\n  box-shadow: 0 2px 10px rgba(0, 0, 0, .35)\
  \ !important;\n}\n.dashboard-component-chart-holder .header-title, .dashboard-component-chart-holder\
  \ .header-title * {\n  font-weight: 700 !important; font-size: 14px !important;\
  \ letter-spacing: .05em;\n  text-transform: uppercase; color: var(--f1-carbon) !important;\n\
  }\n\n/* KPI tiles */\n.superset-legacy-chart-big-number .header-line {\n  font-weight:\
  \ 900 !important; color: var(--f1-carbon) !important; font-variant-numeric: tabular-nums;\n\
  }\n.superset-legacy-chart-big-number .subheader-line {\n  color: #6B6B76 !important;\
  \ letter-spacing: .08em; font-weight: 600 !important;\n}\n\n/* Tables: carbon header\
  \ row, tabular figures, quiet zebra stripes */\n.dashboard-component-chart-holder\
  \ table thead th {\n  background: var(--f1-carbon) !important; color: #FFFFFF !important;\n\
  \  text-transform: uppercase; font-size: 12px; letter-spacing: .06em; border-bottom:\
  \ 2px solid var(--f1-red) !important;\n}\n.dashboard-component-chart-holder table\
  \ thead th svg { color: #FFFFFF !important; }\n.dashboard-component-chart-holder\
  \ table tbody td { font-variant-numeric: tabular-nums; }\n.dashboard-component-chart-holder\
  \ table tbody tr:nth-child(even) td { background: #F6F6F8; }\n.dashboard-component-chart-holder\
  \ table tbody tr:hover td { background: #FDECEC !important; }\n\n/* Markdown blocks\
  \ are layout, not cards */\n.dashboard-markdown .dashboard-component-chart-holder\
  \ {\n  background: transparent !important; border-top: none !important; box-shadow:\
  \ none !important;\n}\n.dashboard-markdown, .dashboard-markdown .safe-markdown {\
  \ background: transparent !important; }\n\n/* Report banner (the markdown block\
  \ with an h1) */\n.dashboard-markdown .dashboard-component-chart-holder:has(h1)\
  \ {\n  background:\n    linear-gradient(115deg, transparent 0 72%, var(--f1-red)\
  \ 72% 73.2%, transparent 73.2% 75%,\n                    var(--f1-red) 75% 75.6%,\
  \ transparent 75.6%),\n    linear-gradient(90deg, #1F1F2B 0%, #15151E 100%) !important;\n\
  \  border-left: 6px solid var(--f1-red) !important;\n  border-radius: 4px !important;\n\
  }\n.dashboard-markdown h1 {\n  color: #FFFFFF !important; font-weight: 900 !important;\
  \ font-size: 34px !important;\n  letter-spacing: .03em; text-transform: uppercase;\
  \ margin: 6px 0 2px !important;\n}\n.dashboard-markdown h1 + p { color: #C9C9D1\
  \ !important; font-size: 15px; margin: 0 !important; }\n.dashboard-markdown p strong\
  \ { color: var(--f1-red) !important; font-weight: 700; }\n\n/* Section headings\
  \ (the markdown blocks with an h3) */\n.dashboard-markdown h3 {\n  color: #FFFFFF\
  \ !important; font-weight: 700 !important; font-size: 18px !important;\n  text-transform:\
  \ uppercase; letter-spacing: .08em; margin: 10px 0 0 !important;\n  padding-left:\
  \ 12px; border-left: 4px solid var(--f1-red);\n}\n.dashboard-markdown h3 em { color:\
  \ var(--f1-red); font-style: normal; margin-right: 6px; }\n.dashboard-markdown h3\
  \ + p { color: #8E8E99 !important; font-size: 13px; margin: 2px 0 0 16px !important;\
  \ }\n\n/* Pages: each tab is one 16:9 slide (PowerPoint widescreen, 1280 x 720 px)\
  \ */\n/* Superset sizes chart columns from the container width, so the container\
  \ is the slide's\n   inner width (1248) and the 1280 px frame reaches 16 px past\
  \ it on each side. */\n.dashboard-content .grid-container {\n  width: 1248px !important;\
  \ max-width: 1248px !important; margin: 12px auto 24px !important;\n}\n.dashboard-content\
  \ .grid-container .ant-tabs-content-holder {\n  box-sizing: border-box; width: 1280px;\
  \ height: 720px; overflow: hidden;\n  margin: 0 -16px; padding: 14px 16px 0;\n \
  \ background: linear-gradient(180deg, #1F1F2B 0%, #15151E 100%) !important;\n  border:\
  \ 1px solid var(--f1-line); border-top: 4px solid var(--f1-red);\n  box-shadow:\
  \ 0 10px 40px rgba(0, 0, 0, .55);\n}\n.dashboard-content .grid-container .ant-tabs-content-holder\
  \ .grid-content {\n  background: transparent !important; border: none !important;\
  \ box-shadow: none !important;\n}\n\n/* Page buttons (the top-level tabs) */\n.dashboard-component-tabs\
  \ .ant-tabs-nav { margin: 0 !important; background: var(--f1-carbon) !important;\
  \ }\n.dashboard-component-tabs .ant-tabs-nav::before { border-bottom: none !important;\
  \ }\n.dashboard-component-tabs .ant-tabs-tab {\n  background: var(--f1-carbon-2)\
  \ !important; border: 1px solid var(--f1-line) !important;\n  border-radius: 4px\
  \ 4px 0 0 !important; margin-right: 6px !important; padding: 8px 22px !important;\n\
  \  transition: background .15s;\n}\n.dashboard-component-tabs .ant-tabs-tab:hover\
  \ { background: #2A2A38 !important; }\n.dashboard-component-tabs .ant-tabs-tab,\
  \ .dashboard-component-tabs .ant-tabs-tab * {\n  color: #A9A9B3 !important; font-weight:\
  \ 700 !important; text-transform: uppercase; letter-spacing: .08em;\n}\n.dashboard-component-tabs\
  \ .ant-tabs-tab-active { background: var(--f1-red) !important; border-color: var(--f1-red)\
  \ !important; }\n.dashboard-component-tabs .ant-tabs-tab-active, .dashboard-component-tabs\
  \ .ant-tabs-tab-active * { color: #FFFFFF !important; }\n.dashboard-component-tabs\
  \ .ant-tabs-ink-bar { display: none !important; }\n\n/* Slide title (the markdown\
  \ block with an h2) */\n.dashboard-markdown .dashboard-component-chart-holder:has(h2)\
  \ {\n  background:\n    linear-gradient(115deg, transparent 0 80%, var(--f1-red)\
  \ 80% 81%, transparent 81% 82.5%,\n                    var(--f1-red) 82.5% 83%,\
  \ transparent 83%) !important;\n}\n.dashboard-markdown h2 {\n  color: #FFFFFF !important;\
  \ font-weight: 900 !important; font-size: 26px !important;\n  text-transform: uppercase;\
  \ letter-spacing: .04em; margin: 0 !important; line-height: 1.15;\n}\n.dashboard-markdown\
  \ h2 em { color: var(--f1-red); font-style: normal; margin-right: 10px; }\n.dashboard-markdown\
  \ h2 + p { color: #A9A9B3 !important; font-size: 13px; margin: 2px 0 0 !important;\
  \ }\n\n/* Horizontal filter bar */\n[data-test=\"filter-bar\"], .filter-bar-horizontal,\
  \ [data-test=\"horizontal-filterbar\"] {\n  background: var(--f1-carbon) !important;\
  \ border-bottom: 1px solid var(--f1-line) !important;\n}\n.ant-form-item-label h4\
  \ {\n  color: #E6E6EB !important; font-weight: 600 !important; text-transform: uppercase;\
  \ letter-spacing: .06em;\n}"
