# Alerts show up at http://localhost:9093. To get notified, uncomment a channel
# below and put its secret in monitoring/secrets/ (git-ignored).
route:
  receiver: data-team
  group_by: [alertname, table]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: data-team
