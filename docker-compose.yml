# Core: docker compose up -d. Optional profiles: monitoring, bi.
# Sized for an 8 GB laptop: the core stack peaks around 4 GB, and the engines
# inside Airflow spill to the warehouse-data volume instead of growing in RAM.

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  # Each task process costs ~150 MB, so keep concurrency low.
  AIRFLOW__CORE__PARALLELISM: "4"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db/${AIRFLOW_DB_NAME}
  AIRFLOW__WEBSERVER__WORKERS: "1"
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  AIRFLOW__METRICS__STATSD_ON: "true"
  AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
  AIRFLOW__METRICS__STATSD_PORT: "9125"
  AIRFLOW__METRICS__STATSD_PREFIX: airflow
  PYTHONPATH: /opt/airflow/project
  TZ: UTC

x-airflow-common: &airflow-common
  # Only airflow-init builds the image; the others reuse it to avoid a tag race.
  image: f1-airflow:2.9.3
  pull_policy: never
  env_file: .env
  environment:
    <<: *airflow-env
  user: "${AIRFLOW_UID:-50000}:0"
  working_dir: /opt/airflow/project
  volumes:
    - ./:/opt/airflow/project
    - airflow-logs:/opt/airflow/logs
    - warehouse-data:/data
  depends_on: &airflow-depends
    airflow-db:
      condition: service_healthy
    source-db:
      condition: service_healthy
    lake-init:
      condition: service_completed_successfully

services:
  # ------------------------------------------------------------------ source
  # PostgreSQL playing the team's on-prem telemetry store, tuned down for a laptop.
  source-db:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - max_connections=40
    environment:
      POSTGRES_USER: ${SOURCE_DB_USER}
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD}
      POSTGRES_DB: ${SOURCE_DB_NAME}
    ports:
      # 5433 on the host, since 5432 is often taken by a local PostgreSQL.
      - "5433:5432"
    volumes:
      - source-db-data:/var/lib/postgresql/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ------------------------------------------------------------------ lake
  # SeaweedFS with the S3 API, so the same client code would work against AWS S3.
  lake:
    image: chrislusf/seaweedfs:4.51
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"pipeline","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$LAKE_ACCESS_KEY" "$$LAKE_SECRET_KEY" > /tmp/s3.json
        && exec weed server -dir=/data -ip=lake -ip.bind=0.0.0.0
        -master.volumeSizeLimitMB=1024 -volume.index=leveldb
        -filer -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # file browser
    volumes:
      - lake-data:/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8888/ && wget -q -O /dev/null http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Creates the bucket; "already exists" also counts as success.
  lake-init:
    image: chrislusf/seaweedfs:4.51
    env_file: .env
    depends_on:
      lake:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        out=$$(echo "s3.bucket.create -name $$LAKE_BUCKET" | weed shell -master=lake:9333 -filer=lake:8888 2>&1);
        echo "$$out";
        echo "$$out" | grep -q -e "created bucket" -e "already exists"

  # ------------------------------------------------------------------ airflow
  airflow-db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50"]
    mem_limit: 384m
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 20

  airflow-init:
    <<: *airflow-common
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    pull_policy: build
    # The pool serializes every task that opens DuckDB: it takes one writer.
    command:
      - bash
      - -c
      - airflow pools set duckdb 1 "DuckDB allows a single writer at a time"
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}

  airflow:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ------------------------------------------------------------------ metrics sinks
  # Always on (they are tiny) so metrics always have somewhere to go.
  statsd-exporter:
    image: prom/statsd-exporter:v0.26.1
    command: ["--statsd.mapping-config=/etc/statsd/statsd_mapping.yml"]
    mem_limit: 64m
    volumes:
      - ./monitoring/statsd_mapping.yml:/etc/statsd/statsd_mapping.yml:ro
    ports:
      - "9102:9102"

  pushgateway:
    image: prom/pushgateway:v1.9.0
    mem_limit: 64m
    ports:
      - "9091:9091"

  # ------------------------------------------------------------------ monitoring profile
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    mem_limit: 384m
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    mem_limit: 64m
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/secrets:/etc/alertmanager/secrets:ro
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    mem_limit: 256m
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # ------------------------------------------------------------------ bi profile
  superset:
    build:
      context: .
      dockerfile: docker/superset.Dockerfile
    image: f1-superset:4.0.2
    profiles: ["bi"]
    mem_limit: 1g
    environment:
      # One gunicorn worker instead of the default pool: plenty for one viewer.
      SERVER_WORKER_AMOUNT: "1"
    env_file: .env
    command:
      - /bin/sh
      - -c
      - superset db upgrade
        && (superset fab create-admin --username "$$SUPERSET_ADMIN_USER" --password "$$SUPERSET_ADMIN_PASSWORD"
            --firstname Admin --lastname User --email admin@example.com || true)
        && superset init
        && /usr/bin/run-server.sh
    volumes:
      - superset-data:/app/superset_home
      # Read-only: Superset reads the copy published after each run, never the live file.
      - warehouse-data:/data:ro
      # Dashboards as code: bi/superset_bi.py exports to and restores from here.
      - ./bi:/app/bi
      # Team-colour palettes for the F1 report (picked up from Superset's PYTHONPATH).
      - ./docker/superset_config.py:/app/pythonpath/superset_config.py:ro
    ports:
      - "8088:8088"

volumes:
  source-db-data:
  warehouse-data:
  lake-data:
  airflow-db-data:
  airflow-logs:
  prometheus-data:
  grafana-data:
  superset-data:
